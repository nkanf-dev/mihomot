name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: mihomot

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      previous_tag: ${{ steps.release.outputs.previous_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tags must look like v1.2.3 or v1.2.3-rc.1" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

          previous_tag="$(git tag --merged "$tag" --sort=-creatordate \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$' \
            | grep -Fxv "$tag" \
            | head -n 1 || true)"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

          if [[ "$tag" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Sync crate version to release tag
        shell: bash
        run: |
          set -euo pipefail

          version="${{ needs.prepare.outputs.version }}"

          python3 - <<'PY'
          import pathlib
          import re

          version = "${{ needs.prepare.outputs.version }}"

          cargo_toml = pathlib.Path("Cargo.toml")
          cargo_toml.write_text(
              re.sub(
                  r'(?m)^(version = ")([^"]+)(")$',
                  rf'\g<1>{version}\3',
                  cargo_toml.read_text(),
                  count=1,
              )
          )

          cargo_lock = pathlib.Path("Cargo.lock")
          lines = cargo_lock.read_text().splitlines()
          for i, line in enumerate(lines):
              if line == 'name = "mihomot"':
                  if i + 1 >= len(lines) or not lines[i + 1].startswith('version = "'):
                      raise RuntimeError("Could not locate mihomot version entry in Cargo.lock")
                  lines[i + 1] = f'version = "{version}"'
                  break
          else:
              raise RuntimeError("Could not locate mihomot package in Cargo.lock")

          cargo_lock.write_text("\n".join(lines) + "\n")
          PY

          grep -m1 '^version = ' Cargo.toml

      - name: Test
        run: cargo test --locked --verbose

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}" --verbose

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.prepare.outputs.tag }}"
          target="${{ matrix.target }}"
          package="${BIN_NAME}-${tag}-${target}"
          latest_package="${BIN_NAME}-${target}"

          mkdir -p "dist/$package"
          cp "target/${target}/release/${BIN_NAME}" "dist/$package/"
          cp README.md LICENSE skill.md "dist/$package/"

          tar -C dist -czf "${package}.tar.gz" "$package"
          sha256sum "${package}.tar.gz" > "${package}.tar.gz.sha256"

          cp "${package}.tar.gz" "${latest_package}.tar.gz"
          sha256sum "${latest_package}.tar.gz" > "${latest_package}.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}-${{ needs.prepare.outputs.tag }}-${{ matrix.target }}
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - prepare
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.BIN_NAME }}-${{ needs.prepare.outputs.tag }}-*
          path: dist
          merge-multiple: true

      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0

      - name: Generate release notes
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ needs.prepare.outputs.tag }}"
          previous_tag="${{ needs.prepare.outputs.previous_tag }}"

          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tag = os.environ["TAG"]
          previous_tag = os.environ.get("PREVIOUS_TAG", "").strip()

          if previous_tag:
              rev_range = f"{previous_tag}..{tag}"
              compare_url = f"https://github.com/nkanf-dev/mihomot/compare/{previous_tag}...{tag}"
          else:
              rev_range = tag
              compare_url = f"https://github.com/nkanf-dev/mihomot/releases/tag/{tag}"

          log_output = subprocess.check_output(
              ["git", "log", "--format=%H%x09%s", rev_range],
              text=True,
          ).splitlines()

          categories = [
              ("Features", ["feat"]),
              ("Bug Fixes", ["fix"]),
              ("Documentation", ["docs", "doc"]),
              ("CI", ["ci"]),
              ("Refactors", ["refactor"]),
              ("Testing", ["test"]),
          ]
          grouped = {title: [] for title, _ in categories}
          other = []

          for line in log_output:
              if not line.strip():
                  continue
              sha, subject = line.split("\t", 1)
              normalized = subject.strip()
              match = re.match(r"^([a-zA-Z0-9_-]+)(\(.+\))?!?:\s+(.*)$", normalized)
              key = match.group(1).lower() if match else None

              entry = f"* {normalized} ({sha[:7]})"
              placed = False
              if key:
                  for title, prefixes in categories:
                      if key in prefixes:
                          grouped[title].append(entry)
                          placed = True
                          break
              if not placed:
                  other.append(entry)

          lines = [f"## {tag}", ""]

          if previous_tag:
              lines.append(f"Changes since `{previous_tag}`.")
              lines.append("")

          emitted = False
          for title, _ in categories:
              items = grouped[title]
              if not items:
                  continue
              emitted = True
              lines.append(f"### {title}")
              lines.extend(items)
              lines.append("")

          if other:
              emitted = True
              lines.append("### Other Changes")
              lines.extend(other)
              lines.append("")

          if not emitted:
              lines.append("* No user-facing changes were detected in commit subjects.")
              lines.append("")

          lines.append(f"**Full Changelog**: {compare_url}")
          lines.append("")

          Path("release-notes.md").write_text("\n".join(lines))
          PY
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          body_path: release-notes.md
          prerelease: ${{ needs.prepare.outputs.prerelease }}
          files: dist/*
